<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 主渐变背景 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>

    <!-- 玻璃高光渐变 -->
    <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1" />
    </linearGradient>

    <!-- 节点渐变 -->
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:0.95" />
    </linearGradient>

    <!-- 切换箭头渐变 -->
    <linearGradient id="switchGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67E8F9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>

    <!-- 内阴影滤镜 -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>

    <!-- 投影 -->
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>

    <!-- 节点发光 -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 背景模糊 -->
    <filter id="bgBlur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- 剪裁圆角 -->
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- 背景圆角矩形 -->
  <g clip-path="url(#roundedClip)">
    <!-- 主背景 -->
    <rect x="0" y="0" width="512" height="512" fill="url(#bgGradient)"/>

    <!-- 装饰性模糊圆形 -->
    <circle cx="140" cy="120" r="180" fill="#818CF8" opacity="0.3" filter="url(#bgBlur)"/>
    <circle cx="400" cy="380" r="200" fill="#06B6D4" opacity="0.25" filter="url(#bgBlur)"/>
    <circle cx="380" cy="140" r="120" fill="#C084FC" opacity="0.2" filter="url(#bgBlur)"/>

    <!-- 玻璃覆盖层 -->
    <rect x="0" y="0" width="512" height="512" fill="url(#glassHighlight)"/>
  </g>

  <!-- 图标主体组 -->
  <g filter="url(#dropShadow)">
    <!-- 网络节点 - 中央 -->
    <circle cx="256" cy="220" r="40" fill="url(#nodeGradient)" filter="url(#nodeGlow)" opacity="0.95"/>

    <!-- 网络节点 - 左上 -->
    <circle cx="160" cy="155" r="24" fill="url(#nodeGradient)" opacity="0.85"/>

    <!-- 网络节点 - 右上 -->
    <circle cx="352" cy="155" r="24" fill="url(#nodeGradient)" opacity="0.85"/>

    <!-- 网络节点 - 左下 -->
    <circle cx="160" cy="320" r="24" fill="url(#nodeGradient)" opacity="0.85"/>

    <!-- 网络节点 - 右下 -->
    <circle cx="352" cy="320" r="24" fill="url(#nodeGradient)" opacity="0.85"/>

    <!-- 连接线 -->
    <g stroke="white" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" fill="none">
      <!-- 左上到中央 -->
      <line x1="178" y1="168" x2="226" y2="200"/>
      <!-- 右上到中央 -->
      <line x1="334" y1="168" x2="286" y2="200"/>
      <!-- 左下到中央 -->
      <line x1="178" y1="305" x2="226" y2="240"/>
      <!-- 右下到中央 -->
      <line x1="334" y1="305" x2="286" y2="240"/>
      <!-- 左上到右上 -->
      <line x1="184" y1="155" x2="328" y2="155"/>
      <!-- 左下到右下 -->
      <line x1="184" y1="320" x2="328" y2="320"/>
    </g>

    <!-- 中央节点的内部细节 - 切换图标 -->
    <g transform="translate(256, 220)">
      <!-- 切换箭头形成循环 -->
      <path d="M-14,-18 C-30,-10 -20,10 -14,18" stroke="url(#switchGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M14,-18 C30,-10 20,10 14,18" stroke="url(#switchGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- 箭头尖端 -->
      <polyline points="-18,10 -14,18 -6,14" stroke="url(#switchGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <polyline points="18,10 14,18 6,14" stroke="url(#switchGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- 配置文件层叠卡片 -->
    <g transform="translate(200, 340)" opacity="0.7">
      <rect x="0" y="0" width="112" height="56" rx="12" fill="white" opacity="0.15"/>
      <rect x="0" y="-10" width="112" height="56" rx="12" fill="white" opacity="0.12"/>
      <rect x="0" y="-20" width="112" height="56" rx="12" fill="white" opacity="0.1"/>
    </g>
  </g>

  <!-- 顶部玻璃高光弧线 -->
  <g clip-path="url(#roundedClip)">
    <ellipse cx="256" cy="-20" rx="200" ry="120" fill="white" opacity="0.06"/>
  </g>
</svg>
