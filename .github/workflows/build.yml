name: Build Decky Plugin

on:
  push:
    branches: [main, master]
    tags:
      - '*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare build metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build_sha: ${{ steps.build_metadata.outputs.build_sha }}
      is_tag: ${{ steps.build_metadata.outputs.is_tag }}
      version: ${{ steps.build_metadata.outputs.version }}

    steps:
      - name: Extract tag version
        id: tag_version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Checkout default branch for version bump
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js for version bump
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update version, commit and push
        id: tag_commit
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          version="${{ steps.tag_version.outputs.version }}"
          default_branch="${{ github.event.repository.default_branch }}"

          npm version "${version}" --no-git-tag-version --allow-same-version

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json

          if git diff --cached --quiet; then
            git commit --allow-empty -m "chore: release v${version} [skip ci]"
          else
            git commit -m "chore: release v${version} [skip ci]"
          fi

          git push origin "HEAD:${default_branch}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Resolve build metadata
        id: build_metadata
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "is_tag=true" >> "${GITHUB_OUTPUT}"
            echo "version=${{ steps.tag_version.outputs.version }}" >> "${GITHUB_OUTPUT}"
            echo "build_sha=${{ steps.tag_commit.outputs.sha }}" >> "${GITHUB_OUTPUT}"
          else
            echo "is_tag=false" >> "${GITHUB_OUTPUT}"
            echo "version=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            echo "build_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.is_tag == 'true' && needs.prepare.outputs.build_sha || github.ref }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y curl gcc make

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Decky CLI
        run: |
          mkdir -p cli
          curl -L -o cli/decky https://github.com/SteamDeckHomebrew/cli/releases/latest/download/decky-linux-x86_64
          chmod +x cli/decky

      - name: Build plugin package
        run: |
          ./.vscode/build.sh
          echo "=== packaged plugin ==="
          find out -maxdepth 1 -type f -name '*.zip' -print

      - uses: actions/upload-artifact@v4
        with:
          name: netprofile-switcher-steamdeck
          path: out/*.zip
          if-no-files-found: error
          retention-days: 30
